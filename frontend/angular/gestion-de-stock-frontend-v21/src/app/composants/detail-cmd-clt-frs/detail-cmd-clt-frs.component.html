<div class="cmd-head">
  <div class="cmd-head-photo">
    <img src="assets/product.png" alt="Article" width="72" height="72">
  </div>

  <div class="cmd-head-clt">
    <span>{{ cltFrs()?.nom }}</span>
    <span>{{ cltFrs()?.prenom }}</span>
    <span class="text-muted tnum">{{ cltFrs()?.numTel }}</span>
  </div>

  <div class="cmd-head-cmd">
    <span class="tnum">{{ commande().code }}</span>
    <span class="text-muted">{{ commande().dateCommande | date:'dd/MM/yyyy HH:mm' }}</span>
    <span class="pill-tag-soft">{{ commande().etatCommande }}</span>
  </div>

  <div class="cmd-head-actions">
    <button type="button" class="btn-link" (click)="modifierClick()">Modifier</button>
    <button type="button" class="btn-link btn-link-danger">Supprimer</button>
  </div>
</div>
