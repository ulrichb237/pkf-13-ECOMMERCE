<div class="menu">
  <div class="card" *ngFor="let menu of menuProperties">
    <button type="button" class="card-cmd-header menu-title"
            (click)="basculerMenu(menu.id!)"
            [attr.aria-expanded]="menusOuverts.has(menu.id!)">
      <span class="menu-icon">{{ (menu.titre || '').substring(0, 1) }}</span>
      {{ menu.titre }}
    </button>

    <div *ngIf="menusOuverts.has(menu.id!)" class="menu-items">
      <ul class="list-group list-group-flush">
        <li class="list-group-item" *ngFor="let sousMenu of menu.sousMenu"
            [ngClass]="{'list-item-active': sousMenu.active}">
          <a href="javascript:void(0);" (click)="navigate(sousMenu)" class="menu-link">
            <span class="menu-icon menu-icon-sm">{{ (sousMenu.titre || '').substring(0, 1) }}</span>
            {{ sousMenu.titre }}
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="card menu-logout">
    <button type="button" class="card-cmd-header menu-title menu-title-logout"
            (click)="deconnexion()"
            aria-label="Se deconnecter">
      <span class="menu-icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </span>
      Deconnexion
    </button>
  </div>
</div>
