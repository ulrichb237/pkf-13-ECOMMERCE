<div class="cltfrs-card custom-border">
  <div class="cltfrs-photo">
    <img src="assets/product.png" alt="Article" width="100" height="100">
  </div>

  <div class="cltfrs-info">
    <span class="cltfrs-nom tnum">Code article</span>
    <span>designation</span>
    <span class="tnum">prix HT</span>
    <span class="tnum">prix TTC</span>
  </div>

  <div class="mvt-stock">
    <span class="caption">Stock actuel</span>
    <span class="mvt-stock-value tnum">139</span>
  </div>

  <div class="cltfrs-actions">
    <button type="button" class="btn btn-secondary" (click)="correctionVisible = true">Correction de stock</button>
  </div>
</div>

<!-- Dialog correction de stock (remplace la modale Bootstrap) -->
<div class="dialog-backdrop" *ngIf="correctionVisible" (click)="correctionVisible = false">
  <div class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h3 class="dialog-title">Correction de stock</h3>
      <button type="button" class="dialog-close" (click)="correctionVisible = false" aria-label="Fermer">&times;</button>
    </div>
    <div class="dialog-body">
      <form>
        <label class="caption" for="quantite-correction">Quantite</label>
        <input id="quantite-correction" type="number" min="1" class="form-control" placeholder="Quantite">

        <label class="caption" for="type-correction" style="margin-top: var(--sp-md)">Type de correction</label>
        <select id="type-correction" class="form-control">
          <option>Correction positive</option>
          <option>Correction negative</option>
        </select>
      </form>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn-pill btn-pill-secondary" (click)="correctionVisible = false">Annuler</button>
      <button type="button" class="btn-pill btn-pill-primary">Enregistrer</button>
    </div>
  </div>
</div>
