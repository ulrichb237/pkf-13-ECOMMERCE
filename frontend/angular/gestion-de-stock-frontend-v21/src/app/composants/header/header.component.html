<header class="header">
  <div class="header-search input-group">
    <span class="input-group-text" aria-hidden="true">⌕</span>
    <input type="text" class="form-control" placeholder="Rechercher..." aria-label="Recherche">
  </div>

  <div class="header-user">
    <span class="text-muted">Bonjour {{ connectedUser.nom }}&nbsp;</span>
    <a href="javascript:void(0);" [routerLink]="['/profil']" aria-label="Mon profil">
      <img src="favicon.ico" class="header-avatar" alt="Avatar" />
    </a>
  </div>
</header>
