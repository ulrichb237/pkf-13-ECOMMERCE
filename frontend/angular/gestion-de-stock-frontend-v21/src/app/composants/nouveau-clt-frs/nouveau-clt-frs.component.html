<div class="page">
  <div class="page-header">
    <h2>Information du {{ origin }}</h2>
  </div>

  <div class="alert alert-danger" *ngIf="errorMsg.length > 0">
    <div *ngFor="let msg of errorMsg">{{ msg }}</div>
  </div>

  <div class="card custom-border p-3">
    <button type="button" class="photo-upload" (click)="fileInput.click()" aria-label="Changer la photo">
      <img [src]="imgUrl" class="profil-avatar profil-avatar-lg" alt="Photo" />
      <input hidden type="file" #fileInput (change)="onFileInput(fileInput.files)">
    </button>

    <form>
      <div class="form-grid-2">
        <input type="text" class="form-control" placeholder="Nom" name="nom" [(ngModel)]="clientFournisseur.nom">
        <input type="text" class="form-control" placeholder="Adresse 1" name="adresse1" [(ngModel)]="adresseDto.adresse1">
        <input type="text" class="form-control" placeholder="Prenom" name="prenom" [(ngModel)]="clientFournisseur.prenom">
        <input type="text" class="form-control" placeholder="Adresse 2" name="adresse2" [(ngModel)]="adresseDto.adresse2">
        <input type="email" class="form-control" placeholder="E-mail" name="email" [(ngModel)]="clientFournisseur.mail">
        <input type="text" class="form-control" placeholder="Ville" name="ville" [(ngModel)]="adresseDto.ville">
        <input type="tel" class="form-control" placeholder="Telephone" name="numtel" [(ngModel)]="clientFournisseur.numTel">
        <input type="text" class="form-control" placeholder="Code postal" name="codepostal" [(ngModel)]="adresseDto.codePostale">
        <span></span>
        <input type="text" class="form-control" placeholder="Pays" name="pays" [(ngModel)]="adresseDto.pays">
      </div>
    </form>
  </div>

  <div class="form-actions mt-2">
    <button class="btn btn-secondary" (click)="cancelClick()">Annuler</button>
    <button class="btn btn-primary" (click)="enregistrer()">Enregistrer</button>
  </div>
</div>
