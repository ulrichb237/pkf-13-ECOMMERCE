<div class="page">
  <div class="page-header">
    <h2>Nouvelle commande {{ origin }}</h2>
  </div>

  <div class="alert alert-danger" *ngIf="errorMsg.length">
    <div *ngFor="let msg of errorMsg"><span>{{ msg }}</span></div>
  </div>

  <div class="card custom-border p-3">
    <div class="cmd-form-grid">
      <div class="cmd-form-fields">
        <input type="text" class="form-control" name="codeCmd" placeholder="Code commande" [(ngModel)]="codeCommande">
        <select class="form-control" name="cltFrs" [(ngModel)]="selectedClientFournisseur">
          <option [ngValue]="null" disabled>Selectionner un {{ origin }}</option>
          <option *ngFor="let obj of listClientsFournisseurs" [ngValue]="obj">
            {{ obj.nom }}&nbsp;{{ obj.prenom }}
          </option>
        </select>
      </div>

      <div class="cmd-form-clt" *ngIf="selectedClientFournisseur?.nom">
        <span>{{ selectedClientFournisseur.nom }}</span>
        <span>{{ selectedClientFournisseur.prenom }}</span>
        <span class="text-muted tnum">{{ selectedClientFournisseur.numTel }}</span>
        <span class="pill-tag-soft">EN PREPARATION</span>
      </div>

      <div class="cmd-form-photo" *ngIf="selectedClientFournisseur?.nom">
        <img [src]="selectedClientFournisseur.photo ? selectedClientFournisseur.photo : 'assets/product.png'"
             [alt]="'Photo de ' + selectedClientFournisseur.nom" width="110" height="110">
      </div>
    </div>
  </div>

  <div class="card custom-border p-3 mt-2">
    <div class="form-grid-4">
      <div class="autocomplete-wrap">
        <input type="text" class="form-control" placeholder="Code article"
               [(ngModel)]="codeArticle" (input)="filtrerArticle()">
        <div *ngIf="codeArticle.length && !articleNotYetSelected" class="autocomplete">
          <p class="autocomplete-item tnum" *ngFor="let article of listArticle" (click)="selectArticleClick(article)">
            {{ article.codeArticle }}&nbsp; {{ article.designation }}
          </p>
        </div>
      </div>
      <input type="number" min="1" class="form-control" placeholder="Quantite" [(ngModel)]="quantite">
      <input type="text" class="form-control" placeholder="Prix unitaire" [(ngModel)]="searchedArticle.prixUnitaireTtc">
      <button type="button" class="btn btn-success" (click)="ajouterLigneCommande()">Ajouter</button>
    </div>
  </div>

  <div class="card custom-border p-3 mt-2 lignes-scroll">
    <app-detail-cmd *ngFor="let ligne of lignesCommande()"
                    [ligneCommande]="ligne"
                    (suppressionLigne)="retirerLigne($event)"
                    (quantiteModifiee)="majQuantiteLigne($event)"></app-detail-cmd>
    <div class="empty-state empty-state-sm" *ngIf="!lignesCommande().length">Aucune ligne ajoutee</div>
  </div>

  <div class="card custom-border p-3 mt-2 text-right">
    <h3 class="tnum" style="margin:0">Total de la commande : {{ totalCommande() }} €</h3>
  </div>

  <div class="form-actions mt-2">
    <button class="btn btn-secondary" [routerLink]="[returnUrl]">Annuler</button>
    <button class="btn btn-primary" (click)="enregistrerCommande()">Enregistrer</button>
  </div>
</div>
