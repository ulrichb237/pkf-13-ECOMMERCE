<div class="col">
  <div class="row m-3">
    <div class="col-md-8 p-0">
      <h1>Liste des ventes</h1>
    </div>
    <div class="col-md-4 text-right">
      <app-boutton-action
        [isExporterVisible]="false"
        [isImporterVisible]="false"
        (clickEvent)="nouvelleVente()"
      ></app-boutton-action>
    </div>
    <div class="alert alert-danger" *ngIf="errorMsg">
      {{ errorMsg }}
    </div>
  </div>
  <div class="col m-3">
    <div class="row custom-border font-weight-bold mb-1" *ngIf="listVentes.length">
      <div class="col-md-3 text-center">Code vente</div>
      <div class="col-md-3 text-center">Date</div>
      <div class="col-md-4 text-center">Commentaire</div>
      <div class="col-md-2 text-center">Total lignes</div>
    </div>
    <div class="row custom-border mb-1 mr-0" *ngFor="let vente of listVentes">
      <div class="col-md-3 custom-border-right mb-1 mt-1 text-center">{{ vente.code }}</div>
      <div class="col-md-3 custom-border-right mb-1 mt-1 text-center">{{ vente.dateVente | date:'dd/MM/yyyy HH:mm' }}</div>
      <div class="col-md-3 custom-border-right mb-1 mt-1 text-center">{{ vente.commentaire }}</div>
      <div class="col-md-3 mb-1 mt-1 text-center">
        <button type="button" class="btn btn-link text-danger" data-toggle="modal" data-target="#modalDeleteVente"
                (click)="selectVentePourSupprimer(vente.id)" aria-label="Supprimer la vente {{ vente.code }}">
          <i class="fas fa-trash-alt" aria-hidden="true"></i>&nbsp;Supprimer
        </button>
      </div>
    </div>

    <!-- Modal confirmation suppression vente -->
    <div class="modal fade" id="modalDeleteVente" data-backdrop="static" data-keyboard="false" tabindex="-1" role="dialog"
         aria-labelledby="modalDeleteVenteLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalDeleteVenteLabel">Confirmation</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Fermer">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            Etes-vous sur de vouloir supprimer cette vente ?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="annulerSuppressionVente()">
              <i class="fas fa-ban" aria-hidden="true"></i>&nbsp;Annuler
            </button>
            <button type="button" class="btn btn-danger" data-dismiss="modal" (click)="confirmerEtSupprimerVente()">
              <i class="fas fa-trash-alt" aria-hidden="true"></i>&nbsp;Supprimer
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="text-center text-muted p-3" *ngIf="!listVentes.length">
      Aucune vente enregistree
    </div>
  </div>
  <div class="row mb-3" *ngIf="listVentes.length">
    <div class=" col-md-12 text-center">
      <app-pagination></app-pagination>
    </div>
  </div>
</div>
