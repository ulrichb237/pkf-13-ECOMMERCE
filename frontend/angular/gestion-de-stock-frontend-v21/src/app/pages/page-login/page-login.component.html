<div class="mesh-hero">
  <div class="auth-card">
    <span class="pill-tag-soft">Gestion de stock</span>
    <h2>Se connecter</h2>
    <p class="text-muted">Accedez a votre espace de gestion.</p>

    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

    <label class="caption" for="login-email">E-mail</label>
    <input id="login-email" type="email" class="form-control" placeholder="E-mail"
           [(ngModel)]="authenticationRequest.login" autocomplete="username">

    <label class="caption" for="login-password">Mot de passe</label>
    <input id="login-password" type="password" class="form-control" placeholder="Mot de passe"
           [(ngModel)]="authenticationRequest.password" autocomplete="current-password">

    <button type="button" class="btn btn-primary" (click)="login()">Se connecter</button>
    <p class="text-muted text-center auth-alt">
      <a [routerLink]="['/motdepasseoublie']" class="btn-link">Mot de passe oublie ?</a>
    </p>
    <p class="text-muted text-center auth-alt">Pas encore de compte ?
      <a [routerLink]="['/inscrire']" class="btn-link">S'inscrire</a>
    </p>
  </div>
</div>
