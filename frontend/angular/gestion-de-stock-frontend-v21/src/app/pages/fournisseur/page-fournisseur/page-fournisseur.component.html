<div class="page">
  <div class="page-header">
    <h1>Liste des fournisseurs</h1>
    <app-boutton-action (clickEvent)="nouveauFournisseur()"></app-boutton-action>
  </div>

  <div class="alert alert-danger" *ngIf="errorMsg()">{{ errorMsg() }}</div>

  <div class="empty-state" *ngIf="!listFournisseur().length && !errorMsg()">Aucun fournisseur enregistre</div>

  <div class="page-content">
    <app-detail-clt-frs
      *ngFor="let fournisseur of listFournisseur(); track fournisseur.id"
      [clientFournisseur]="fournisseur"
      [origin]="'fournisseur'"
      (suppressionResult)="handleSuppression($event)"
    ></app-detail-clt-frs>
  </div>

  <div class="page-pagination" *ngIf="listFournisseur().length">
    <app-pagination></app-pagination>
  </div>
</div>
