<div class="page">
  <div class="profil-grid">
    <div class="card custom-border p-3 text-center profil-photo-card">
      <img src="assets/product.png" class="profil-avatar" alt="Photo de profil" />
      <h2>Nom Prenom</h2>
      <small class="text-muted">Adresse, Ville, 12345</small>
      <div class="profil-actions">
        <button type="button" class="btn btn-primary">Modifier le profil</button>
        <button type="button" class="btn btn-warning" (click)="modifierMotDePasse()">Changer le mot de passe</button>
      </div>
    </div>

    <div class="card custom-border p-3">
      <table class="data-table">
        <tbody>
          <tr><th scope="row">Nom complet</th><td>nom prenom</td></tr>
          <tr><th scope="row">Email</th><td>adresse@email.com</td></tr>
          <tr><th scope="row">Telephone</th><td class="tnum">011 22 33 44 55 66</td></tr>
          <tr><th scope="row">Adresse</th><td>Adresse, Ville, 12345</td></tr>
          <tr><th scope="row">Entreprise</th><td>Nom entreprise</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
