<div class="page">
  <div class="page-header">
    <h1>Gestion des mouvements de stock</h1>
  </div>

  <div class="alert alert-danger" *ngIf="errorMsg()">{{ errorMsg() }}</div>
  <div class="alert alert-success" *ngIf="successMsg()">{{ successMsg() }}</div>

  <div class="empty-state" *ngIf="!listArticle().length && !errorMsg()">Aucun article enregistre</div>

  <div *ngFor="let article of listArticle()" class="card">
    <button type="button" class="card-cmd-header" (click)="basculerArticle(article.id)"
            [attr.aria-expanded]="articlesOuverts().has(article.id!)">
      <div class="mvt-article-head">
        <span class="tnum">{{ article.codeArticle }}</span>
        <span>{{ article.designation }}</span>
        <span class="pill-tag-soft" *ngIf="mapStockReel().get(article.id!) !== undefined">
          Stock : {{ mapStockReel().get(article.id!) }}
        </span>
      </div>
    </button>

    <div class="card-cmd-body" *ngIf="articlesOuverts().has(article.id!)">
      <div class="empty-state empty-state-sm" *ngIf="!mapMvtstk().get(article.id!)?.length">
        Aucun mouvement pour cet article
      </div>
      <table class="data-table" *ngIf="mapMvtstk().get(article.id!)?.length">
        <thead><tr><th>Date</th><th>Quantite</th><th>Type</th><th>Source</th></tr></thead>
        <tbody>
          <tr *ngFor="let mvt of mapMvtstk().get(article.id!)">
            <td>{{ mvt.dateMvt | date:'dd/MM/yyyy HH:mm' }}</td>
            <td class="tnum">{{ mvt.quantite }}</td>
            <td>
              <span class="pill-tag-soft">{{ mvt.typeMvt }}</span>
            </td>
            <td>{{ mvt.sourceMvt }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Formulaire de mouvement -->
  <div class="card custom-border m-3 p-3">
    <h3 class="mt-3">Nouveau mouvement de stock</h3>
    <div class="mvt-form">
      <div class="mvt-form-field">
        <label class="caption" for="articleMvt">Article</label>
        <select id="articleMvt" name="articleMvt" [(ngModel)]="selectedArticle">
          <option [ngValue]="null" disabled>Choisir un article</option>
          <option *ngFor="let article of listArticle()" [ngValue]="article">
            {{ article.codeArticle }} — {{ article.designation }}
          </option>
        </select>
      </div>
      <div class="mvt-form-field">
        <label class="caption" for="quantiteMvt">Quantite</label>
        <input id="quantiteMvt" type="number" min="1" name="quantiteMvt" [(ngModel)]="quantite" placeholder="Quantite">
      </div>
      <div class="mvt-form-actions">
        <button type="button" class="btn btn-success" (click)="effectuerMouvement('ENTREE')">Entree</button>
        <button type="button" class="btn btn-danger" (click)="effectuerMouvement('SORTIE')">Sortie</button>
        <button type="button" class="btn btn-primary" (click)="effectuerMouvement('CORRECTION_POS')">Correction +</button>
        <button type="button" class="btn btn-secondary" (click)="effectuerMouvement('CORRECTION_NEG')">Correction -</button>
      </div>
    </div>
  </div>
</div>
