<div class="page">
  <div class="page-header">
    <h1>Commande {{origin}}s</h1>
    <app-boutton-action
      [isImporterVisible]="false"
      (clickEvent)="nouvelleCommande()"
    ></app-boutton-action>
  </div>

  <div class="alert alert-danger" *ngIf="errorMsg">{{ errorMsg }}</div>
  <div class="empty-state" *ngIf="!listeCommandes.length && !errorMsg">
    Aucune commande
  </div>

  <div *ngFor="let cmd of listeCommandes" class="card card-cmd">
    <button type="button" class="card-cmd-header" (click)="basculerAccordeon(cmd.id)"
            [attr.aria-expanded]="commandesOuvertes.has(cmd.id)">
      <app-detail-cmd-clt-frs
        [commande]="cmd"
        [origin]="origin"
      ></app-detail-cmd-clt-frs>
    </button>

    <div class="card-cmd-body" *ngIf="commandesOuvertes.has(cmd.id)">
      <app-detail-cmd
        *ngFor="let ligne of mapLignesCommande.get(cmd.id)"
        [ligneCommande]="ligne"
        [origin]="origin"
        (suppressionLigne)="supprimerLigneCommande($event)"
      ></app-detail-cmd>
      <div class="empty-state empty-state-sm" *ngIf="!mapLignesCommande.get(cmd.id)?.length">
        Aucune ligne dans cette commande
      </div>
    </div>

    <div class="card-cmd-footer">
      <span class="caption">{{ mapLignesCommande.get(cmd.id)?.length || 0 }} ligne(s) de commande</span>
      <span class="caption tnum">
        Total : {{ calculerTotalCommande(cmd.id) }} €
        <button type="button" class="btn-link btn-link-danger" (click)="demanderSuppressionCommande(cmd)"
                aria-label="Supprimer la commande">
          Supprimer
        </button>
      </span>
    </div>
  </div>

  <!-- Confirmation de suppression de commande (remplace la modale Bootstrap) -->
  <div class="dialog-backdrop" *ngIf="commandeASupprimer" (click)="annulerSuppressionCommande()">
    <div class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <h3 class="dialog-title">Confirmation</h3>
      <p>Supprimer la commande {{ commandeASupprimer.code }} ?</p>
      <div class="dialog-actions">
        <button type="button" class="btn-pill btn-pill-secondary" (click)="annulerSuppressionCommande()">Annuler</button>
        <button type="button" class="btn-pill btn-pill-danger" (click)="supprimerCommande(commandeASupprimer.id); commandeASupprimer = null">Supprimer</button>
      </div>
    </div>
  </div>

  <div class="page-pagination" *ngIf="listeCommandes.length">
    <app-pagination></app-pagination>
  </div>
</div>
