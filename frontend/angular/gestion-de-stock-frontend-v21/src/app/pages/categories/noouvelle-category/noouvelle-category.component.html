<div class="page">
  <div class="page-header">
    <h2>Nouvelle categorie</h2>
  </div>

  <div class="alert alert-danger" *ngIf="errorMsg.length > 0">
    <div *ngFor="let msg of errorMsg"><span>{{ msg }}</span></div>
  </div>

  <div class="card custom-border p-3">
    <form>
      <label class="caption" for="codeCat">Code</label>
      <input id="codeCat" type="text" class="form-control" placeholder="Code categorie" name="codeCat" [(ngModel)]="categoryDto.code">

      <label class="caption" for="designationCat" style="margin-top: var(--sp-md)">Description</label>
      <input id="designationCat" type="text" class="form-control" placeholder="Description" name="designationCat" [(ngModel)]="categoryDto.designation">
    </form>
  </div>

  <div class="form-actions mt-2">
    <button class="btn btn-secondary" (click)="cancel()">Annuler</button>
    <button class="btn btn-primary" (click)="enregistrerCategory()">Enregistrer</button>
  </div>
</div>
