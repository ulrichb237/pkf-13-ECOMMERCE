<div class="mesh-hero">
  <div class="auth-card">
    <span class="pill-tag-soft">Gestion de stock</span>
    <h2>S'inscrire</h2>
    <p class="text-muted">Creez votre entreprise et votre compte administrateur.</p>

    <div class="alert alert-danger" *ngIf="errorsMsg.length > 0">
      <div *ngFor="let msg of errorsMsg"><span>{{ msg }}</span></div>
    </div>

    <h3>Entreprise</h3>
    <div class="form-grid">
      <input type="text" class="form-control" placeholder="Nom" [(ngModel)]="entrepriseDto.nom">
      <input type="text" class="form-control" placeholder="Code fiscal" [(ngModel)]="entrepriseDto.codeFiscal">
      <input type="email" class="form-control" placeholder="E-mail" [(ngModel)]="entrepriseDto.email">
      <input type="tel" class="form-control" placeholder="Numero de telephone" [(ngModel)]="entrepriseDto.numTel">
    </div>

    <h3>Adresse</h3>
    <div class="form-grid">
      <input type="text" class="form-control" placeholder="Adresse 1" [(ngModel)]="adresse.adresse1">
      <input type="text" class="form-control" placeholder="Adresse 2" [(ngModel)]="adresse.adresse2">
      <input type="text" class="form-control" placeholder="Ville" [(ngModel)]="adresse.ville">
      <input type="text" class="form-control" placeholder="Code postal" [(ngModel)]="adresse.codePostale">
      <input type="text" class="form-control" placeholder="Pays" [(ngModel)]="adresse.pays">
    </div>

    <label class="caption" for="description">Description</label>
    <textarea id="description" class="form-control" placeholder="Description" rows="3"
              [(ngModel)]="entrepriseDto.description"></textarea>

    <button type="button" class="btn btn-primary" (click)="inscrire()">S'inscrire</button>
    <p class="text-muted text-center auth-alt">Deja un compte ?
      <a [routerLink]="['/login']" class="btn-link">Se connecter</a>
    </p>
  </div>
</div>
