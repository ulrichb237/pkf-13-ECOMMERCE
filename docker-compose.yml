# Lancement :
#   docker compose up -d --build                  -> mysql + api
#   docker compose --profile tools up -d          -> + adminer + mailpit
# Les valeurs viennent du fichier .env (copier .env.example).
# Les identifiants MySQL du conteneur sont les variables DOCKER_DB_* (les DB_* servent hors Docker).

services:
  mysql:
    image: mysql:latest
    pull_policy: missing
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?DOCKER_DB_ROOT_PASSWORD est obligatoire}
      MYSQL_DATABASE: ${DB_NAME:-gestionstock}
      MYSQL_USER: ${DOCKER_DB_USERNAME:?DOCKER_DB_USERNAME est obligatoire}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?DOCKER_DB_PASSWORD est obligatoire}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend/gestion-de-stock-api
    image: gestion-de-stock-api:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-gestionstock}
      DB_USERNAME: ${DOCKER_DB_USERNAME:?DOCKER_DB_USERNAME est obligatoire}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?DOCKER_DB_PASSWORD est obligatoire}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      SERVER_PORT: "8081"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-36000000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ENTREPRISE_DEFAULT_PASSWORD: ${ENTREPRISE_DEFAULT_PASSWORD:?ENTREPRISE_DEFAULT_PASSWORD est obligatoire}
      FLICKR_API_KEY: ${FLICKR_API_KEY:?FLICKR_API_KEY est obligatoire}
      FLICKR_API_SECRET: ${FLICKR_API_SECRET:?FLICKR_API_SECRET est obligatoire}
      FLICKR_APP_KEY: ${FLICKR_APP_KEY:?FLICKR_APP_KEY est obligatoire}
      FLICKR_APP_SECRET: ${FLICKR_APP_SECRET:?FLICKR_APP_SECRET est obligatoire}
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "${API_HOST_PORT:-8081}:8081"

  adminer:
    image: adminer:latest
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_HOST_PORT:-8082}:8080"

  mailpit:
    image: axllent/mailpit:latest
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  mysql_data:
